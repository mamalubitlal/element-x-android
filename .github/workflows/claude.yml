name: Claude Code with OpenAI Endpoint via Proxy

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude-openai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # Run the translation proxy as a service container
    services:
      claude-proxy:
        image: ghcr.io/nielspeter/claude-code-proxy:latest
        ports:
          - 3000:3000
        env:
          # Your OpenAI‑compatible endpoint
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Map Claude's default models to your chosen model
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.MODEL_NAME }}
          # Optional: require a key for the proxy itself
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          # Dummy key – the proxy will handle real auth
          anthropic_api_key: dummy-key
        env:
          # Point Claude to the local proxy
          ANTHROPIC_BASE_URL: http://localhost:3000
          # If you set PROXY_API_KEY above, pass it here
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.PROXY_API_KEY }}
          # Again map the models (the proxy needs to know which model to use)
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.MODEL_NAME }}
