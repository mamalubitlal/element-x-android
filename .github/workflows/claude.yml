name: Claude Code with OpenCode Zen (Big Pickle)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude-openai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code Router
        run: npm install -g @musistudio/claude-code-router

      - name: Create router config
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json << EOF
          {
            "NON_INTERACTIVE_MODE": true,
            "API_TIMEOUT_MS": 600000,
            "Providers": [
              {
                "name": "opencode",
                "api_base_url": "${{ secrets.OPENAI_BASE_URL }}",
                "api_key": "${{ secrets.OPENROUTER_API_KEY }}",
                "models": ["${{ secrets.MODEL_NAME }}"]
              }
            ],
            "Router": {
              "default": "opencode,${{ secrets.MODEL_NAME }}"
            }
          }
          EOF

      - name: Start Claude Code Router in background
        run: |
          ccr start &
          sleep 5
          # Verify router is running
          curl --fail http://127.0.0.1:3456/health || exit 1

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: "sk-ant-dummy"
        env:
          ANTHROPIC_BASE_URL: "http://127.0.0.1:3456"
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.MODEL_NAME }}
