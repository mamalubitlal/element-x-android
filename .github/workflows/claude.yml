name: Claude Code (opencode.ai)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    services:
      proxy:
        image: ghcr.io/1rgs/claude-code-proxy:main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/v1
          PREFERRED_PROVIDER: openai
          BIG_MODEL: nemotron-3-super-free
          SMALL_MODEL: big-pickle
          ANTHROPIC_API_KEY: sk-placeholder
          GEMINI_API_KEY: sk-placeholder
        ports:
          - 8082:8082
        options: >-
          --health-cmd "curl -f http://localhost:8082/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Wait for proxy service
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8082/ 2>/dev/null; then
              echo "Proxy ready!"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Use placeholder key; proxy handles real auth
          anthropic_api_key: sk-placeholder
          # Optional: Add any model or turn limits
          claude_args: |
            --max-turns 10
        env:
          # Override API endpoint to use local proxy
          ANTHROPIC_BASE_URL: http://localhost:8082      proxy:
        image: ghcr.io/1rgs/claude-code-proxy:main
        env:
          # Use opencode.ai as the OpenAI-compatible backend
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/v1
          # Map Claude models to Qwen3.6-Plus-Free
          PREFERRED_PROVIDER: openai
          BIG_MODEL: nemotron-3-super-free
          SMALL_MODEL: big-pickle
          # Disable Anthropic/Gemini backends (we only use opencode.ai)
          ANTHROPIC_API_KEY: sk-placeholder
          GEMINI_API_KEY: sk-placeholder
        ports:
          - 8082:8082
        options: >-
          --health-cmd "curl -f http://localhost:8082/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Wait for proxy to be healthy
      - name: Wait for proxy service
        run: |
          echo "Waiting for claude-code-proxy to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:8082/ 2>/dev/null; then
              echo "Proxy is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Proxy failed to start"
          exit 1

      # Checkout repository (required for Claude Code to analyze code)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run Claude Code with proxy endpoint
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Use placeholder key (actual auth happens via proxy)
          anthropic_api_key: sk-placeholder
          # Point to the local proxy instead of Anthropic's API
          claude_args: >-
            --max-turns 10
            --model claude-sonnet-4-6
        env:
          # Override the base URL to use our local proxy
          ANTHROPIC_BASE_URL: http://localhost:8082
          
