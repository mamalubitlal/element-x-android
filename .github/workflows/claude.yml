name: Claude Code with OpenCode Zen (Big Pickle)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude-openai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    services:
      claude-proxy:
        image: ghcr.io/1rgs/claude-code-proxy:latest
        ports:
          - 8082:8082
        env:
          # Reuse your existing OpenRouter API key
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Reuse your existing base URL (already points to OpenRouter)
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PREFERRED_PROVIDER: "openai"
          BIG_MODEL: ${{ secrets.MODEL_NAME }}
          SMALL_MODEL: ${{ secrets.MODEL_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: "dummy-key"
        env:
          ANTHROPIC_BASE_URL: "http://localhost:8082"
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.MODEL_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          # Dummy key – the proxy will handle real auth
          anthropic_api_key: dummy-key
        env:
          # Point Claude to the local proxy
          ANTHROPIC_BASE_URL: http://localhost:3000
          # If you set PROXY_API_KEY above, pass it here
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.PROXY_API_KEY }}
          # Again map the models (the proxy needs to know which model to use)
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.MODEL_NAME }}
