name: Claude Code with OpenCode Zen (Big Pickle)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude-openai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    services:
      claude-proxy:
        image: ghcr.io/1rgs/claude-code-proxy:latest
        ports:
          - 8082:8082
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PREFERRED_PROVIDER: "openai"
          BIG_MODEL: ${{ secrets.MODEL_NAME }}
          SMALL_MODEL: ${{ secrets.MODEL_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   # ✅ ADDED – required for commenting
          anthropic_api_key: "sk-ant-dummy"           # ✅ Changed to Anthropic‑format placeholder
        env:
          ANTHROPIC_BASE_URL: "http://localhost:8082"
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.MODEL_NAME }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.MODEL_NAME }}
