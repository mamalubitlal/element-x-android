name: DPI Bypass Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache
  ARCH: x86_64
  DEVICE: pixel_7_pro
  API_LEVEL: 30
  TARGET: google_apis

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ format('dpi-test-build-{0}', github.ref) }}
      cancel-in-progress: true
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        name: Use JDK 21
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble debug APK
        run: ./gradlew :app:assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES
        env:
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
      - name: Upload APK as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: chator-dpi-apk
          path: |
            app/build/outputs/apk/gplay/debug/app-gplay-x86_64-debug.apk
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  dpi-bypass-test:
    name: DPI Bypass Test
    runs-on: macos-latest
    needs: [ build-apk ]
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    concurrency:
      group: dpi-bypass-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chator-dpi-apk
      - name: Install maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Kill stale ADB and restart
        run: |
          adb kill-server || true
          adb start-server || true
          sleep 2
      - name: Run DPI bypass test in emulator
        id: maestro_test
        uses: reactivecircus/android-emulator-runner@5d6e86df22ab11632167a1a6b0c9ab0dc3469586
        continue-on-error: true
        env:
          MAESTRO_APP_ID: io.element.android.x.debug
          MAESTRO_USERNAME: ${{ secrets.TESTUSR }}
          MAESTRO_PASSWORD: ${{ secrets.TESTPSW }}
          MAESTRO_RECOVERY_KEY: ${{ secrets.TESTUSR_RECOVERY_KEY }}
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.DEVICE }}
          target: ${{ env.TARGET }}
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 15m
          script: |
            adb install -r app-gplay-x86_64-debug.apk
            ~/.maestro/bin/maestro test \
              -e MAESTRO_APP_ID=io.element.android.x.debug \
              -e MAESTRO_USERNAME=${MAESTRO_USERNAME} \
              -e MAESTRO_PASSWORD=${MAESTRO_PASSWORD} \
              -e MAESTRO_RECOVERY_KEY=${MAESTRO_RECOVERY_KEY} \
              .maestro/tests/dpi/loginAndEnableDpiBypass.yaml
      - name: Upload screenshots on failure
        if: steps.maestro_test.outcome != 'success'
        run: |
          mkdir -p build/maestro
          adb pull /sdcard/maestro/ build/maestro/ 2>/dev/null || true
          adb pull /sdcard/screenshots/ build/maestro/ 2>/dev/null || true
      - name: Upload test results
        if: failure() || steps.maestro_test.outcome == 'failure'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dpi-test-results
          path: |
            build/maestro/**
            ~/.maestro/tests/**
          retention-days: 5
          overwrite: true
          if-no-files-found: warn
      - name: Update summary (success)
        if: steps.maestro_test.outcome == 'success'
        run: |
          echo "## ✅ DPI Bypass Test Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The app successfully:" >> $GITHUB_STEP_SUMMARY
          echo "1. Logged in with recovery key" >> $GITHUB_STEP_SUMMARY
          echo "2. Navigated to DPI settings" >> $GITHUB_STEP_SUMMARY
          echo "3. Enabled DPI bypass" >> $GITHUB_STEP_SUMMARY
      - name: Update summary (failure)
        if: steps.maestro_test.outcome != 'success'
        run: |
          LOG_FILE=$(find ~/.maestro/tests/ -name maestro.log 2>/dev/null | head -1)
          if [ -n "$LOG_FILE" ]; then
            LOG_LINES="$(tail -n 50 $LOG_FILE)"
            echo "## ❌ DPI Bypass Test Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Last 50 lines of maestro log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$LOG_LINES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ DPI Bypass Test Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No maestro log found. Check emulator logs." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Fail the workflow on test failure
        if: steps.maestro_test.outcome != 'success'
        run: |
          echo "DPI Bypass test failed. Check artifacts for screenshots and logs."
          exit 1
