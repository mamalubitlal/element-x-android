name: DPI Bypass Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  dpi-unit-tests:
    name: DPI Unit Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    concurrency:
      group: dpi-unit-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Clean and Run DPI unit tests
        run: |
          ./gradlew :features:preferences:impl:clean :features:preferences:impl:testDebugUnitTest --tests "io.element.android.features.preferences.impl.dpi.*" $CI_GRADLE_ARG_PROPERTIES
        env:
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dpi-unit-test-results
          path: |
            features/preferences/impl/build/test-results/**/*.xml
            features/preferences/impl/build/reports/tests/**/*.html
          retention-days: 5
          if-no-files-found: warn

      - name: Update summary (success)
        if: success()
        run: |
          echo "## ✅ DPI Unit Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All DPI settings presenter tests passed:" >> $GITHUB_STEP_SUMMARY
          echo "- Initial state defaults" >> $GITHUB_STEP_SUMMARY
          echo "- Enable/disable DPI bypass" >> $GITHUB_STEP_SUMMARY
          echo "- Strategy testing" >> $GITHUB_STEP_SUMMARY
          echo "- Best strategy selection" >> $GITHUB_STEP_SUMMARY

      - name: Update summary (failure)
        if: failure()
        run: |
          echo "## ❌ DPI Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check test results artifact for details." >> $GITHUB_STEP_SUMMARY
