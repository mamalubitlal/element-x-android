name: Screenshots Hierarchy

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --no-configuration-cache

jobs:
  generate-hierarchy:
    name: Generate screen hierarchy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout with LFS
        uses: nschloe/action-cached-lfs-checkout@v1
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Record Paparazzi screenshots (all shards)
        run: |
          ./gradlew :tests:uitests:recordPaparazziDebug --stacktrace ${{ env.CI_GRADLE_ARG_PROPERTIES }}

      - name: Record Roborazzi screenshots (Compound)
        run: |
          ./gradlew :libraries:compound:recordRoborazziDebug --stacktrace -PpreDexEnable=false --max-workers 4 ${{ env.CI_GRADLE_ARG_PROPERTIES }}

      - name: Generate screen hierarchy documentation
        id: gen-docs
        run: |
          chmod +x .github/workflows/scripts/generate-hierarchy.sh
          ./.github/workflows/scripts/generate-hierarchy.sh

      - name: Generate navigation flow hierarchy
        run: |
          python .github/workflows/scripts/generate-flow-hierarchy.py
          # Merge into screen-hierarchy for deployment
          cp -r flow-hierarchy/* screen-hierarchy/flow-hierarchy/

      - name: Upload hierarchy documentation as artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-hierarchy-docs
          path: screen-hierarchy/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./screen-hierarchy
          destination_dir: screenshots
          keep_files: true