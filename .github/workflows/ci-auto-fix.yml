# Claude Code GitHub Action with OpenAI-Compatible Backend (opencode.ai)
#
# This workflow runs when DPI bypass test fails and auto-fixes the issue.
# Uses Claude Code to analyze errors and push fixes directly to develop.

name: CI Auto-Fix

on:
  workflow_run:
    workflows: ["DPI Bypass Test"]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'DPI Bypass Test'
    runs-on: ubuntu-latest
    
    services:
      proxy:
        image: ghcr.io/1rgs/claude-code-proxy:main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/v1
          PREFERRED_PROVIDER: openai
          BIG_MODEL: nemotron-3-super-free
          SMALL_MODEL: big-pickle
          ANTHROPIC_API_KEY: sk-placeholder
          GEMINI_API_KEY: sk-placeholder
        ports:
          - 8082:8082
        options: >-
          --health-cmd "curl -f http://localhost:8082/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      # Download the failed workflow logs
      - name: Download workflow logs
        uses: actions/download-artifact@v4
        with:
          name: dpi-test-results
          run_id: ${{ github.event.workflow_run.id }}
        continue-on-error: true
      
      # Get the workflow run details
      - name: Get workflow run info
        id: workflow-info
        run: |
          echo "workflow_name=${{ github.event.workflow_run.name }}" >> $GITHUB_OUTPUT
          echo "workflow_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "workflow_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
      
      # Checkout with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Create prompt file with error context
      - name: Create fix prompt
        run: |
          cat > /tmp/ci-fix-prompt.txt << 'EOF'
          ## CI Failure: DPI Bypass Test on develop branch
          
          The DPI Bypass Test workflow just failed.
          View the failure: ${{ github.event.workflow_run.html_url }}
          
          ### Your Task
          1. Check the workflow logs to understand the error
          2. Look at the test file: `.maestro/tests/dpi/loginAndEnableDpiBypass.yaml`
          3. Look at the workflow file: `.github/workflows/dpi-bypass-test.yml`
          4. Fix the issue causing the test to fail
          5. Push the fix directly to develop branch
          
          ### Common Issues to Look For
          - Emulator startup failures (ADB connection issues)
          - Maestro test flow issues (wrong element IDs or text)
          - Environment variable problems
          - Timeout issues
          
          ### Important
          - Only modify test-related files, NOT the app build
          - Push fix directly: `git push origin develop`
          - Keep the fix minimal - don't over-engineer
          EOF
      
      # Start the proxy
      - name: Wait for proxy service
        run: |
          echo "Waiting for claude-code-proxy to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:8082/ 2>/dev/null; then
              echo "Proxy is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Proxy failed to start"
          exit 1
        continue-on-error: true
      
      # Run Claude Code to fix the issue
      - name: Run Claude Code - Auto-Fix CI
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: sk-placeholder
          claude_args: >-
            --max-turns 5
            --model claude-sonnet-4-6
            --dangerously-skip-permissions
        env:
          ANTHROPIC_BASE_URL: http://localhost:8082
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      # Push the fix if changes exist
      - name: Push fix
        run: |
          if git diff --quiet; then
            echo "No changes made by agent"
          else
            echo "Pushing fixes..."
            git config user.name "CI Auto-Fix"
            git config user.email "ci@github.actions"
            git add -A
            git commit -m "fix(CI): auto-fix DPI test failure" || true
            git push origin develop || echo "Push failed or nothing to push"
          fi
      
      # Report results
      - name: Report results
        run: |
          echo "## CI Auto-Fix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if git diff --quiet; then
            echo "⚠️ No fixes were applied" >> $GITHUB_STEP_SUMMARY
            echo "The agent was unable to identify a solution." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Fixes have been pushed to develop" >> $GITHUB_STEP_SUMMARY
            echo "CI will automatically re-run with the fixes." >> $GITHUB_STEP_SUMMARY
          fi
